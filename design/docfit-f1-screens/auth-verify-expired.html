<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link expired · DocFit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center justify-center px-4 py-12">

  <!-- Logo -->
  <a href="#" class="flex items-center gap-2.5 mb-10">
    <div class="w-8 h-8 bg-teal-700 rounded-lg flex items-center justify-center">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
    </div>
    <span class="text-slate-900 font-semibold text-xl tracking-tight">DocFit</span>
  </a>

  <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 px-8 py-10 text-center">

    <!-- Warning icon -->
    <div class="w-14 h-14 bg-amber-50 rounded-full flex items-center justify-center mx-auto">
      <svg class="w-7 h-7 text-amber-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
    </div>

    <h1 class="mt-5 text-xl font-bold text-slate-900 tracking-tight">Verification link expired</h1>
    <p class="mt-2 text-sm text-slate-500 leading-relaxed">This link is no longer valid. Verification links expire after 24 hours for your security.</p>

    <hr class="my-6 border-slate-100" />

    <p class="text-xs text-slate-500 mb-4">Enter your email and we'll send a fresh link.</p>

    <form class="space-y-3" novalidate>
      <input type="email" placeholder="j.hartwell@nhs.net" class="w-full px-3 py-2.5 text-sm bg-white border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 transition" />
      <button type="submit" class="w-full py-2.5 px-4 bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold rounded-lg transition-colors">
        Send a new verification link
      </button>
    </form>

    <p class="mt-5 text-xs text-slate-400">
      <a href="auth-signin.html" class="text-teal-700 font-medium hover:underline">Back to sign in</a>
    </p>
  </div>

</body>
</html>
