<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-factor authentication · DocFit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    .otp-input { font-variant-numeric: tabular-nums; letter-spacing: 0.25em; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center justify-center px-4 py-12">

  <!-- Logo -->
  <a href="index.html" class="flex items-center gap-2.5 mb-10">
    <div class="w-8 h-8 bg-teal-700 rounded-lg flex items-center justify-center">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
    </div>
    <span class="text-slate-900 font-semibold text-xl tracking-tight">DocFit</span>
  </a>

  <!-- Step progress -->
  <div class="flex items-center gap-2 mb-8">
    <div class="flex items-center gap-1.5">
      <div class="w-5 h-5 rounded-full bg-teal-700 flex items-center justify-center">
        <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 12 12"><path stroke-linecap="round" stroke-linejoin="round" d="M2 6l3 3 5-5"/></svg>
      </div>
      <span class="text-xs font-medium text-teal-700">Credentials</span>
    </div>
    <div class="w-8 h-px bg-slate-300"></div>
    <div class="flex items-center gap-1.5">
      <div class="w-5 h-5 rounded-full bg-teal-700 flex items-center justify-center">
        <span class="text-xs font-bold text-white">2</span>
      </div>
      <span class="text-xs font-medium text-slate-700">Two-factor code</span>
    </div>
  </div>

  <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 px-8 py-9">

    <!-- Shield icon -->
    <div class="w-12 h-12 bg-teal-50 rounded-xl flex items-center justify-center mb-5">
      <svg class="w-6 h-6 text-teal-700" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
    </div>

    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Two-factor authentication</h1>
    <p class="mt-1.5 text-sm text-slate-500 leading-snug">Enter the 6-digit code from your authenticator app.</p>

    <!-- Signed-in-as indicator -->
    <div class="mt-4 flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
      <div class="w-6 h-6 rounded-full bg-teal-100 flex items-center justify-center flex-shrink-0">
        <span id="user-initial" class="text-xs font-bold text-teal-700">J</span>
      </div>
      <span id="user-email-display" class="text-xs text-slate-600 truncate">j.hartwell@nhs.net</span>
      <a href="auth-signin.html" class="ml-auto text-xs text-slate-400 hover:text-slate-600 flex-shrink-0">Not you?</a>
    </div>

    <!-- Error message banner -->
    <div id="error-banner" class="hidden mt-4 p-2.5 bg-red-50 border border-red-200 text-red-800 text-xs rounded-lg text-left"></div>

    <form id="mfa-form" class="mt-6 space-y-4" novalidate>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-2">Authentication code</label>
        <!-- Single field for OTP — formatted as 6-digit mono -->
        <input id="otp-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000 000" class="otp-input w-full px-4 py-3 text-2xl font-bold text-center bg-white border-2 border-slate-200 rounded-lg text-slate-900 placeholder-slate-300 focus:outline-none focus:border-teal-500 transition tracking-widest" autocomplete="one-time-code" required />
        <div class="mt-2 flex items-center justify-between">
          <p class="text-xs text-slate-400">Code rotates every 30 seconds</p>
          <!-- timer -->
          <div class="flex items-center gap-1">
            <svg class="w-3 h-3 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span id="countdown" class="text-xs font-medium text-amber-600">24s</span>
          </div>
        </div>
      </div>

      <button id="verify-btn" type="submit" class="w-full py-2.5 px-4 bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold rounded-lg transition-colors">
        Verify and sign in
      </button>
    </form>

    <div class="mt-5 pt-5 border-t border-slate-100 text-center space-y-2">
      <p class="text-xs text-slate-400">Hint for testing: enter any 6-digit code like <code class="font-mono text-teal-700">123456</code></p>
      <a href="auth-signin.html" class="inline-block text-xs text-teal-700 hover:underline font-medium">Use backup recovery code</a>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email') || 'j.hartwell@nhs.net';
    const form = document.getElementById('mfa-form');
    const otpInput = document.getElementById('otp-input');
    const verifyBtn = document.getElementById('verify-btn');
    const errorBanner = document.getElementById('error-banner');
    const userEmailDisplay = document.getElementById('user-email-display');
    const userInitial = document.getElementById('user-initial');
    const countdownEl = document.getElementById('countdown');

    userEmailDisplay.textContent = email;
    userInitial.textContent = email.charAt(0).toUpperCase();

    // Subtle countdown timer animation
    let secondsLeft = 24;
    setInterval(() => {
      secondsLeft = secondsLeft > 1 ? secondsLeft - 1 : 30;
      countdownEl.textContent = `${secondsLeft}s`;
    }, 1000);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.classList.add('hidden');

      const code = otpInput.value.trim();
      if (!code || code.length < 6) {
        errorBanner.textContent = 'Please enter a valid 6-digit authentication code.';
        errorBanner.classList.remove('hidden');
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying code…';

      try {
        const res = await fetch('/api/auth/mfa/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });

        const data = await res.json();
        if (!res.ok) {
          errorBanner.textContent = data.error || 'Authentication code incorrect.';
          errorBanner.classList.remove('hidden');
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify and sign in';
          return;
        }

        localStorage.setItem('docfit_token', data.token);
        localStorage.setItem('docfit_user', JSON.stringify(data.user));
        window.location.href = 'patient-dashboard.html';
      } catch (err) {
        errorBanner.textContent = 'Network error verifying code.';
        errorBanner.classList.remove('hidden');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify and sign in';
      }
    });
  </script>
</body>
</html>
