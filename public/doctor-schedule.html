<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-slate-50 min-h-screen">

  <nav class="flex-1 p-3 space-y-0.5">

      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      Dashboard
    </a>
    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white hover:bg-teal-700/50">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"/><path d="M1 14c0-3.314 3.134-6 7-6s7 2.686 7 6"/></svg>

    </a>
    <a href="/doctor-schedule.html" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm bg-teal-700 text-white">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="12" rx="1.5"/><path d="M5 1v4M11 1v4M2 7h12"/></svg>
      Schedule
    </a>
    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white hover:bg-teal-700/50">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10c0 1.1-.9 2-2 2H5l-3 3V4c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v6z"/></svg>
      Messages
    </a>
    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white hover:bg-teal-700/50">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v1.5M8 9.5V11M6.5 6.5C6.5 5.7 7.2 5 8 5s1.5.7 1.5 1.5c0 1.5-3 1.5-3 3C6.5 10.3 7.2 11 8 11s1.5-.7 1.5-1.5"/></svg>
      Earnings
    </a>
    <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white hover:bg-teal-700/50">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/></svg>
      Settings
    </a>
  </nav>
  <div class="p-3 border-t border-teal-700/60">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-full bg-teal-600 text-white text-xs flex items-center justify-center font-semibold flex-shrink-0">AO</div>
      <div class="min-w-0">
        <div class="text-teal-200 text-xs font-medium truncate">Dr. A. Osei-Bonsu</div>
        <div class="text-teal-400 text-xs">Cardiologist</div>
      </div>
    </div>
  </div>
</aside>

<div class="ml-56">
  <header class="h-14 bg-white border-b border-slate-200 sticky top-0 z-10 flex items-center justify-between px-6">
    <span class="text-base font-semibold text-slate-800 tracking-tight">My Schedule</span>
    <div class="flex items-center gap-4">
      <svg class="text-slate-400" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2a6 6 0 0 0-6 6v3l-1.5 2.5h15L16 11V8a6 6 0 0 0-6-6z"/><path d="M8.5 17.5a1.5 1.5 0 0 0 3 0"/></svg>
      <div class="w-px h-5 bg-slate-200"></div>
      <span class="text-sm text-slate-700">Dr. Amara Osei-Bonsu</span>
      <div class="w-8 h-8 rounded-full bg-teal-100 text-teal-700 text-xs font-semibold flex items-center justify-center">AO</div>
    </div>
  </header>

  <div class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between">
    <span class="text-sm font-semibold text-slate-700">Recurring weekly schedule</span>
    <div class="flex items-center gap-3">
      <span class="text-sm text-slate-600">Slot length</span>
      <select id="slotLengthSelect" class="border border-slate-300 rounded-md text-sm px-3 py-1.5 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20">
        <option value="15">15 min</option>
        <option value="20" selected>20 min</option>
        <option value="30">30 min</option>
      </select>
      <button id="saveChangesBtn" class="bg-teal-700 text-white text-sm px-4 py-1.5 rounded-md font-medium hover:bg-teal-800 transition-colors">Save changes</button>
    </div>
  </div>

  <div id="errorBanner" class="hidden mx-6 mt-4 bg-red-50 border border-red-300 rounded-lg p-3 text-sm text-red-700"></div>
  <div id="successBanner" class="hidden mx-6 mt-4 bg-green-50 border border-green-300 rounded-lg p-3 text-sm text-green-700"></div>

  <div class="flex gap-6 p-6">
    <div class="flex-1 min-w-0" id="weeklyContainer">
      <!-- Days populated via JS -->
    </div>

    <div class="w-80 flex-shrink-0">
      <div class="bg-white border border-slate-200 rounded-lg p-4 sticky top-20">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-semibold text-slate-700">Next 14 days</span>
          <span class="text-xs bg-slate-100 text-slate-500 rounded px-2 py-0.5 font-medium">BST (UTC+1)</span>
        </div>

        <div id="previewSlotsContainer" class="space-y-3 max-h-[calc(100vh-220px)] overflow-y-auto pr-1">
          <!-- 14 day slots preview populated via JS -->
        </div>

        <div id="previewStats" class="text-xs text-slate-500 border-t border-slate-100 mt-3 pt-3">
          0 open slots · 0 booked · 0 leave day
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let scheduleData = {
  rules: [],
  exceptions: [],
  slots: [],
  slot_length_minutes: 20
};

const daysOfWeek = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];

async function loadAvailability() {
  try {
    const res = await fetch('/api/doctors/me/availability');
    if (res.ok) {
      scheduleData = await res.json();
      document.getElementById('slotLengthSelect').value = scheduleData.slot_length_minutes || 20;
      renderSchedule();
    }
  } catch (err) {
    console.error('Failed to load availability', err);
  }
}

function renderSchedule() {
  const container = document.getElementById('weeklyContainer');
  let html = '<h2 class="text-sm font-semibold text-slate-700 mb-4">Weekly hours</h2>';

  daysOfWeek.forEach(day => {
    const dayRules = scheduleData.rules.filter(r => r.day_of_week.toLowerCase() === day);
    const capitalized = day.charAt(0).toUpperCase() + day.slice(1);

    if (dayRules.length === 0) {
      html += `
        <div class="bg-white border border-slate-200 rounded-lg mb-3 p-4 flex items-center justify-between">
          <div class="flex items-center">
            <span class="text-sm font-semibold text-slate-800 w-24 flex-shrink-0">${capitalized}</span>
            <span class="text-xs text-slate-400">No hours</span>
          </div>
          <button onclick="addHourBlock('${day}')" class="text-sm text-teal-700 font-medium border border-teal-200 rounded-md px-3 py-1.5 bg-teal-50 hover:bg-teal-100 flex-shrink-0">+ Add hours</button>
        </div>
      `;
    } else {
      html += `
        <div class="bg-white border border-slate-200 rounded-lg mb-3 p-4">
          <div class="flex items-center">
            <span class="text-sm font-semibold text-slate-800 w-24 flex-shrink-0">${capitalized}</span>
            <div class="flex flex-wrap gap-2 flex-1 items-center">
      `;
      dayRules.forEach((rule, rIdx) => {
        html += `
          <span class="bg-teal-50 border border-teal-200 rounded-md px-3 py-1 text-xs text-teal-800 font-medium inline-flex items-center gap-2">
            ${rule.start_local_time} – ${rule.end_local_time}
            <button onclick="removeRule('${rule.id}')" class="text-teal-400 hover:text-red-500 leading-none">✕</button>
          </span>
        `;
      });
      html += `
              <a href="#" onclick="addHourBlock('${day}'); return false;" class="text-xs text-teal-600 font-medium ml-1 self-center hover:text-teal-700">+ Add</a>
            </div>
          </div>
        </div>
      `;
    }
  });

  // Exceptions section
  html += `
    <div class="mt-6 mb-3 flex items-center justify-between">
      <span class="text-sm font-semibold text-slate-700">One-off exceptions</span>
      <button onclick="showAddExceptionForm()" class="text-sm text-teal-700 border border-teal-200 rounded-md px-3 py-1.5 bg-teal-50 hover:bg-teal-100 font-medium">Add exception +</button>
    </div>
  `;

  if (scheduleData.exceptions && scheduleData.exceptions.length > 0) {
    scheduleData.exceptions.forEach(exc => {
      html += `
        <div class="bg-white border border-slate-200 rounded-md p-3 flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-amber-500 text-base leading-none">●</span>
            <span class="text-sm text-slate-700 font-medium">${exc.date} · ${exc.type === 'leave' ? 'Leave — all day' : 'Extra session'} ${exc.note ? '(' + exc.note + ')' : ''}</span>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="removeException('${exc.id}')" class="text-xs text-red-500 hover:text-red-600 font-medium">Remove</button>
          </div>
        </div>
      `;
    });
  } else {
    html += `<p class="text-xs text-slate-400 italic mb-4">No exceptions set.</p>`;
  }

  // Add Exception Form Container
  html += `<div id="exceptionFormContainer"></div>`;

  container.innerHTML = html;
  renderPreviewSlots();
}

function addHourBlock(day) {
  const start = prompt('Enter start time (HH:MM, e.g. 09:00):', '09:00');
  if (!start) return;
  const end = prompt('Enter end time (HH:MM, e.g. 17:00):', '17:00');
  if (!end) return;

  scheduleData.rules.push({
    id: 'rule_' + Date.now(),
    doctor_id: scheduleData.doctor_id,
    day_of_week: day,
    start_local_time: start,
    end_local_time: end,
    timezone: 'Europe/London'
  });
  renderSchedule();
}

function removeRule(ruleId) {
  scheduleData.rules = scheduleData.rules.filter(r => r.id !== ruleId);
  renderSchedule();
}

function showAddExceptionForm() {
  const formContainer = document.getElementById('exceptionFormContainer');
  formContainer.innerHTML = `
    <div class="bg-white border border-slate-200 rounded-lg p-5 mt-3">
      <div class="text-sm font-semibold text-slate-700 mb-4">Add one-off exception</div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5">Exception date <span class="text-red-500">*</span></label>
          <input type="date" id="excDate" value="2026-10-15" class="border border-slate-300 rounded-md text-sm px-3 py-1.5 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20 w-48">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5">Type <span class="text-red-500">*</span></label>
          <select id="excType" class="border border-slate-300 rounded-md text-sm px-3 py-1.5 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20 w-64">
            <option value="leave">Leave / unavailable</option>
            <option value="extra">Extra session (add hours)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5">Note <span class="text-xs font-normal text-slate-400">(optional)</span></label>
          <textarea id="excNote" rows="2" placeholder="e.g. Medical conference" class="border border-slate-300 rounded-md text-sm px-3 py-2 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20 w-full resize-none">Annual cardiology conference</textarea>
        </div>
      </div>
      <div class="flex items-center gap-3 mt-5">
        <button onclick="saveException(false)" class="bg-teal-700 text-white px-4 py-2 text-sm font-medium rounded-md hover:bg-teal-800 transition-colors">Save exception</button>
        <button onclick="renderSchedule()" class="text-sm text-slate-500 px-4 py-2 hover:text-slate-700 transition-colors">Cancel</button>
      </div>
      <div id="bookingWarningArea" class="mt-4"></div>
    </div>
  `;
}

async function saveException(force = false) {
  const date = document.getElementById('excDate').value;
  const type = document.getElementById('excType').value;
  const note = document.getElementById('excNote').value;

  try {
    const res = await fetch('/api/doctors/me/availability-exceptions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, type, note, force })
    });
    const data = await res.json();
    if (res.ok) {
      scheduleData.exceptions = data.exceptions;
      scheduleData.slots = data.slots;
      renderSchedule();
      showSuccess('Exception saved successfully');
    } else if (data.warning) {
      // Display booking warning matching schedule-exception-booking-warning.html
      const warningArea = document.getElementById('bookingWarningArea');
      warningArea.innerHTML = `
        <div class="bg-amber-50 border border-amber-300 rounded-lg p-5">
          <div class="flex items-center gap-2 mb-1">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5L1.5 13h13L8 1.5z"/><path d="M8 6v3.5M8 11v.5"/></svg>
            <span class="text-sm font-semibold text-amber-800">Confirm before saving</span>
          </div>
          <p class="text-sm text-amber-700 mt-1">${data.message}</p>
          ${data.affected_bookings.map(b => `
            <div class="bg-white border border-amber-200 rounded-md p-3 mt-3">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <p class="text-sm font-medium text-slate-800">${b.patient_name}</p>
                  <p class="text-sm text-slate-600 mt-0.5">${b.date} · ${b.time} · ${b.service}</p>
                </div>
                <span class="bg-green-50 text-green-700 border border-green-200 rounded-full px-2.5 py-0.5 text-xs font-medium flex-shrink-0">${b.status}</span>
              </div>
            </div>
          `).join('')}
          <div class="flex flex-wrap gap-3 mt-4">
            <button onclick="alert('Appointment cancelled')" class="border border-red-300 text-red-600 rounded-md px-4 py-2 text-sm font-medium bg-white hover:bg-red-50 transition-colors">Cancel this appointment</button>
            <button onclick="alert('Reschedule modal opened')" class="border border-teal-300 text-teal-700 rounded-md px-4 py-2 text-sm font-medium bg-teal-50 hover:bg-teal-100 transition-colors">Reschedule this appointment</button>
          </div>
          <div class="border-t border-amber-200 mt-4 pt-4">
            <div class="flex flex-wrap items-center gap-1.5">
              <span onclick="saveException(true)" class="text-sm text-amber-800 underline cursor-pointer hover:text-amber-900 font-medium">Proceed with leave (I'll handle the appointment separately)</span>
              <span class="text-sm text-slate-400"> · </span>
              <span onclick="renderSchedule()" class="text-sm text-slate-500 cursor-pointer hover:text-slate-700">Discard leave exception</span>
            </div>
          </div>
        </div>
      `;
    } else {
      showError(data.message || 'Failed to save exception');
    }
  } catch (err) {
    showError('Network error saving exception');
  }
}

async function removeException(excId) {
  try {
    const res = await fetch(`/api/doctors/me/availability-exceptions/${excId}`, { method: 'DELETE' });
    const data = await res.json();
    if (res.ok) {
      scheduleData.exceptions = data.exceptions;
      scheduleData.slots = data.slots;
      renderSchedule();
      showSuccess('Exception removed');
    }
  } catch (err) {
    showError('Failed to remove exception');
  }
}

document.getElementById('saveChangesBtn').addEventListener('click', async () => {
  hideMessages();
  const slotLength = Number(document.getElementById('slotLengthSelect').value);
  try {
    // Update slot length first
    await fetch('/api/doctors/me/slot-length', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slot_length_minutes: slotLength })
    });

    // Update rules
    const res = await fetch('/api/doctors/me/availability-rules', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rules: scheduleData.rules })
    });
    const data = await res.json();
    if (res.ok) {
      scheduleData.rules = data.rules;
      scheduleData.slots = data.slots;
      renderSchedule();
      showSuccess('Schedule saved successfully!');
    } else {
      showError(data.message || 'Error saving rules');
    }
  } catch (err) {
    showError('Network error saving changes');
  }
});

function renderPreviewSlots() {
  const container = document.getElementById('previewSlotsContainer');
  const statsContainer = document.getElementById('previewStats');

  const slotsByDate = {};
  if (scheduleData.slots) {
    scheduleData.slots.forEach(s => {
      if (!slotsByDate[s.date]) slotsByDate[s.date] = [];
      slotsByDate[s.date].push(s);
    });
  }

  let html = '';
  let openCount = 0;
  let bookedCount = 0;
  let leaveCount = 0;

  const startDate = new Date('2026-10-10T00:00:00Z');
  for (let i = 0; i < 14; i++) {
    const d = new Date(startDate.getTime() + i * 24 * 60 * 60 * 1000);
    const dateStr = d.toISOString().split('T')[0];
    const dateDisplay = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

    const dayExceptions = (scheduleData.exceptions || []).filter(e => e.date === dateStr);
    const isLeave = dayExceptions.some(e => e.type === 'leave');

    if (isLeave) leaveCount++;

    html += `<div class="py-2 border-b border-slate-100">`;
    html += `<p class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-1.5">${dateDisplay}</p>`;

    if (isLeave) {
      html += `<span class="bg-amber-50 text-amber-700 border border-amber-200 text-xs rounded px-2 py-0.5">Leave — exception</span>`;
    } else {
      const daySlots = slotsByDate[dateStr] || [];
      if (daySlots.length === 0) {
        html += `<span class="text-xs text-slate-400 italic">No availability</span>`;
      } else {
        html += `<div class="flex flex-wrap gap-1">`;
        daySlots.forEach(slot => {
          openCount++;
          html += `<span class="bg-green-50 text-green-700 border border-green-200 rounded px-2 py-0.5 text-xs">${slot.time_str}</span>`;
        });
        html += `</div>`;
      }
    }
    html += `</div>`;
  }

  container.innerHTML = html;
  statsContainer.textContent = `${openCount} open slots · ${bookedCount} booked · ${leaveCount} leave day`;
}

function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.textContent = msg;
  b.classList.remove('hidden');
}

function showSuccess(msg) {
  const b = document.getElementById('successBanner');
  b.textContent = msg;
  b.classList.remove('hidden');
  setTimeout(() => b.classList.add('hidden'), 4000);
}

function hideMessages() {
  document.getElementById('errorBanner').classList.add('hidden');
  document.getElementById('successBanner').classList.add('hidden');
}

loadAvailability();
</script>
</body>
</html>
