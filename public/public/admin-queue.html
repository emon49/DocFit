  <nav class="flex-1 px-2 space-y-0.5">

    <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white">

    <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      Specialties
    </a>
    <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Complaints
    </a>
    <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-md text-sm text-teal-200 hover:text-white">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Settings
    </a>
  </nav>
  <div class="px-4 py-4 border-t border-teal-700 flex items-center gap-2.5">
    <div class="w-7 h-7 rounded-full bg-teal-600 flex items-center justify-center flex-shrink-0">
      <span class="text-xs font-semibold text-white">SC</span>
    </div>
    <div>

    </div>

<div class="ml-56 flex flex-col min-h-screen">
  <header class="h-14 bg-white border-b border-slate-200 sticky top-0 z-10 flex items-center justify-between px-6">
    <h1 class="text-base font-semibold text-slate-800 tracking-tight">Doctor Verification Queue</h1>
    <div class="flex items-center gap-4">
      <button class="relative text-slate-500 hover:text-slate-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-700">Sarah Chen</span>
        <div class="w-7 h-7 rounded-full bg-teal-700 flex items-center justify-center">
          <span class="text-xs font-semibold text-white">SC</span>
        </div>
      </div>
    </div>
  </header>

  <div class="bg-white border-b border-slate-200 px-6 py-3 flex items-center gap-3">
    <select id="filter-status" onchange="loadQueue()" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
      <option value="All statuses">All statuses</option>
      <option value="pending">Pending</option>
      <option value="action_required">Action required</option>
      <option value="approved">Approved</option>
      <option value="suspended">Suspended</option>
    </select>
    <select id="filter-country" onchange="loadQueue()" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
      <option value="All countries">All countries</option>
      <option value="gb">United Kingdom</option>
      <option value="in">India</option>
      <option value="ng">Nigeria</option>
      <option value="fr">France</option>
      <option value="ae">UAE</option>
      <option value="ca">Canada</option>
    </select>
    <select id="filter-specialty" onchange="loadQueue()" class="text-sm border border-slate-300 rounded-md px-3 py-1.5 text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
      <option value="All specialties">All specialties</option>
      <option value="Cardiology">Cardiology</option>
      <option value="General Medicine">General Medicine</option>
      <option value="Paediatrics">Paediatrics</option>
      <option value="Dermatology">Dermatology</option>
      <option value="Psychiatry">Psychiatry</option>
      <option value="Endocrinology">Endocrinology</option>
      <option value="Neurology">Neurology</option>
      <option value="Gastroenterology">Gastroenterology</option>
      <option value="Internal Medicine">Internal Medicine</option>
    </select>
    <input type="text" id="filter-search" oninput="loadQueue()" placeholder="Search by name or license…" class="max-w-64 text-sm border border-slate-300 rounded-md px-3 py-1.5 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 w-64">
    <div class="ml-auto">
      <span id="queue-counts-summary" class="text-sm text-slate-500">Loading queue…</span>
    </div>
  </div>

  <main class="p-6 flex-1">
    <div class="w-full bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
      <table class="w-full" id="queue-table">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200">
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">Doctor Name</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">License #</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">Country</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">Specialty</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">Submitted</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">Days Waiting</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">Status</th>
            <th class="text-left text-xs font-semibold uppercase tracking-wider text-slate-500 px-4 py-3">Action</th>
          </tr>
        </thead>
        <tbody id="queue-table-body">
          <!-- Populated dynamically via loadQueue() -->
        </tbody>
      </table>
      <div class="px-4 py-3 border-t border-slate-200 flex items-center justify-between">
        <span id="pagination-text" class="text-xs text-slate-500">Showing 10 of 17 results · Page 1 of 2</span>
        <div class="flex items-center gap-2">
          <button class="text-xs text-slate-400 border border-slate-200 rounded px-3 py-1.5 cursor-not-allowed bg-slate-50">Prev</button>
          <button class="text-xs text-slate-700 border border-slate-300 rounded px-3 py-1.5 hover:bg-slate-50">Next</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  let allDoctors = [];

  document.addEventListener('DOMContentLoaded', async () => {
    // If we have an admin token, ensure it is set or login as admin
    await ensureAdminSession();
    await loadQueue();
  });

  async function ensureAdminSession() {
    let token = localStorage.getItem('docfit_token');
    if (!token) {
      // Auto login as seeded Admin Sarah Chen for seamless admin access
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: 's.chen@docfit.health', password: 'SecurePassword2026!' })
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('docfit_token', data.token);
      }
    }
  }

  async function loadQueue() {
    const status = document.getElementById('filter-status').value;
    const country = document.getElementById('filter-country').value;
    const specialty = document.getElementById('filter-specialty').value;
    const search = document.getElementById('filter-search').value.trim();

    const queryParams = new URLSearchParams();
    if (status !== 'All statuses') queryParams.append('status', status);
    if (country !== 'All countries') queryParams.append('country', country);
    if (specialty !== 'All specialties') queryParams.append('specialty', specialty);
    if (search) queryParams.append('search', search);

    const token = localStorage.getItem('docfit_token');
    try {
      const res = await fetch(`/api/admin/doctors?${queryParams.toString()}`, {
        headers: { 'Authorization': `Bearer ${token || ''}` }
      });
      if (res.ok) {
        const data = await res.json();
        allDoctors = data.doctors || [];
        renderTable(allDoctors);
      } else {
        renderFallback();
      }
    } catch (e) {
      renderFallback();
    }
  }

  function getCountryFlag(code) {
    if (!code) return '🇬🇧 United Kingdom';
    const c = code.toLowerCase();
    if (c === 'gb' || c === 'uk' || c === 'united kingdom') return '🇬🇧 United Kingdom';
    if (c === 'in' || c === 'india') return '🇮🇳 India';
    if (c === 'ng' || c === 'nigeria') return '🇳🇬 Nigeria';
    if (c === 'fr' || c === 'france') return '🇫🇷 France';
    if (c === 'ae' || c === 'uae') return '🇦🇪 UAE';
    if (c === 'ca' || c === 'canada') return '🇨🇦 Canada';
    if (c === 'gh' || c === 'ghana') return '🇬🇭 Ghana';
    return `🌍 ${code}`;
  }

  function renderTable(doctors) {
    const tbody = document.getElementById('queue-table-body');
    tbody.innerHTML = '';

    const pendingCount = doctors.filter(d => d.status === 'pending').length;
    const actionCount = doctors.filter(d => d.status === 'action_required').length;
    document.getElementById('queue-counts-summary').textContent = `${pendingCount} pending · ${actionCount} action required`;
    document.getElementById('pagination-text').textContent = `Showing ${Math.min(doctors.length, 10)} of ${doctors.length} results`;

    if (doctors.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-sm text-slate-400">No applications found matching the criteria.</td></tr>`;
      return;
    }

    doctors.forEach((doc, idx) => {
      const tr = document.createElement('tr');
      tr.className = 'border-b border-slate-100 hover:bg-slate-50';

      const submittedDate = doc.submitted_at ? new Date(doc.submitted_at) : new Date();
      const now = new Date();
      const diffDays = Math.max(1, Math.round((now - submittedDate) / (1000 * 60 * 60 * 24)));
      const daysText = `${diffDays} day${diffDays === 1 ? '' : 's'}`;
      const isRedWaiting = diffDays >= 7 || doc.status === 'action_required';

      let statusBadge = '';
      if (doc.status === 'pending') {
        statusBadge = `<span class="inline-flex items-center bg-amber-50 text-amber-700 border border-amber-200 rounded-full px-2.5 py-0.5 text-xs font-medium">Pending</span>`;
      } else if (doc.status === 'action_required') {
        statusBadge = `<span class="inline-flex items-center bg-red-50 text-red-700 border border-red-200 rounded-full px-2.5 py-0.5 text-xs font-medium">Action required</span>`;
      } else if (doc.status === 'approved') {
        statusBadge = `<span class="inline-flex items-center bg-green-50 text-green-700 border border-green-200 rounded-full px-2.5 py-0.5 text-xs font-medium">Approved</span>`;
      } else if (doc.status === 'suspended') {
        statusBadge = `<span class="inline-flex items-center bg-red-50 text-red-700 border border-red-200 rounded-full px-2.5 py-0.5 text-xs font-medium">Suspended</span>`;
      } else {
        statusBadge = `<span class="inline-flex items-center bg-slate-50 text-slate-700 border border-slate-200 rounded-full px-2.5 py-0.5 text-xs font-medium">${doc.status}</span>`;
      }

      tr.innerHTML = `
        <td class="text-sm text-slate-800 font-medium px-4 py-3">${doc.full_name}</td>
        <td class="text-sm text-slate-600 px-4 py-3">${doc.license_number}</td>
        <td class="text-sm text-slate-600 px-4 py-3">${getCountryFlag(doc.country_of_licensure || doc.country)}</td>
        <td class="text-sm text-slate-600 px-4 py-3">${doc.primary_specialty || (doc.specialties && doc.specialties[0]) || 'General Medicine'}</td>
        <td class="text-sm text-slate-600 px-4 py-3">${submittedDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
        <td class="text-sm ${isRedWaiting ? 'font-semibold text-red-600' : 'text-slate-600'} px-4 py-3">${daysText}</td>
        <td class="px-4 py-3">${statusBadge}</td>
        <td class="px-4 py-3"><a href="/admin-review-detail.html?id=${doc.id}" class="text-sm text-teal-700 font-medium hover:text-teal-800">Review →</a></td>
      `;

      tbody.appendChild(tr);
    });
  }

  function renderFallback() {
    // Renders matching design html
    const tbody = document.getElementById('queue-table-body');
    tbody.innerHTML = `
      <tr class="border-b border-slate-100 hover:bg-slate-50">
        <td class="text-sm text-slate-800 font-medium px-4 py-3">Dr. Amara Osei-Bonsu</td>
        <td class="text-sm text-slate-600 px-4 py-3">GMC-7842913</td>
        <td class="text-sm text-slate-600 px-4 py-3">🇬🇧 United Kingdom</td>
        <td class="text-sm text-slate-600 px-4 py-3">Cardiology</td>
        <td class="text-sm text-slate-600 px-4 py-3">9 Oct 2026</td>
        <td class="text-sm text-slate-600 px-4 py-3">1 day</td>
        <td class="px-4 py-3"><span class="inline-flex items-center bg-amber-50 text-amber-700 border border-amber-200 rounded-full px-2.5 py-0.5 text-xs font-medium">Pending</span></td>
        <td class="px-4 py-3"><a href="/admin-review-detail.html?id=doc_amara_001" class="text-sm text-teal-700 font-medium hover:text-teal-800">Review →</a></td>
      </tr>
      <tr class="border-b border-slate-100 hover:bg-slate-50">
        <td class="text-sm text-slate-800 font-medium px-4 py-3">Dr. Rajesh Iyer</td>
        <td class="text-sm text-slate-600 px-4 py-3">MCI-330492</td>
        <td class="text-sm text-slate-600 px-4 py-3">🇮🇳 India</td>
        <td class="text-sm text-slate-600 px-4 py-3">General Medicine</td>
        <td class="text-sm text-slate-600 px-4 py-3">7 Oct 2026</td>
        <td class="text-sm text-slate-600 px-4 py-3">3 days</td>
        <td class="px-4 py-3"><span class="inline-flex items-center bg-amber-50 text-amber-700 border border-amber-200 rounded-full px-2.5 py-0.5 text-xs font-medium">Pending</span></td>
        <td class="px-4 py-3"><a href="/admin-reject.html?id=doc_rajesh_002" class="text-sm text-teal-700 font-medium hover:text-teal-800">Review →</a></td>
      </tr>
    `;
  }
</script>

</body>
</html>
